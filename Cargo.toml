[package]
name = "inquiry"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
publish = false

[dependencies]
taskloop = { git = "https://github.com/xforce-io/taskloop.git", rev = "1c69bcf8a1bc0a7d9a4564bbe93f8b13d7317d04" }
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
roxmltree = "0.21"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
